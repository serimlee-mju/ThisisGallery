<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>This is Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    }

    /* 화면 전체 — 가운데 정렬 */
    .page {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* 크레딧을 뺀 나머지 공간 — 여기 안에서만 무대가 커짐 */
    .stage-area {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: size;
    }

    /* 16:9 무대 — 화면 크기에 맞춰 비율 유지하며 늘었다 줄었다 */
    .stage {
      width: min(100cqw, 100cqh * 16 / 9);
      aspect-ratio: 16 / 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      container-type: inline-size;
    }

    /* 로고 + 부제 묶음 */
    .title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35cqw;            /* 로고와 부제 사이 간격 */
      width: 100%;
      margin-bottom: 1.6cqw;   /* 제목 묶음과 영상 사이 간격 */
    }

    .logo {
      width: 18cqw;
      height: auto;
      display: block;
    }

    .subtitle {
      font-size: max(9px, 0.85cqw);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #000;
      white-space: nowrap;
    }

    .video-wrap {
      width: 66cqw;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      box-shadow: 0 1.2cqw 3cqw rgba(0, 0, 0, 0.12);
    }

    .video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 가운데 재생 버튼 */
    .video-wrap { position: relative; }
    .play-btn {
      position: absolute;
      inset: 0;
      margin: auto;
      width: clamp(52px, 7cqw, 88px);
      height: clamp(52px, 7cqw, 88px);
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }
    .play-btn:hover { transform: scale(1.06); background: rgba(0, 0, 0, 0.75); }
    .play-btn svg { width: 38%; height: 38%; margin-left: 8%; fill: #fff; }
    .play-btn[hidden] { display: none; }

    /* 오른쪽 하단 크레딧 */
    .credit {
      flex-shrink: 0;
      align-self: flex-end;
      padding: 0 clamp(14px, 2.2vw, 36px) clamp(10px, 1.8vw, 28px);
      font-size: clamp(9px, 0.75vw, 12px);
      color: #888;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .credit b { font-weight: inherit; white-space: nowrap; }
    .credit .sep { margin: 0 0.6em; color: #ccc; }
    .credit a { color: inherit; text-decoration: none; }
    .credit a:hover { color: #000; }

    /* ── 세로 화면 안내 ── */
    .rotate-notice {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #111;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 24px;
    }

    .rotate-notice .phone {
      width: 44px;
      height: 76px;
      border: 3px solid #fff;
      border-radius: 9px;
      position: relative;
      animation: rotate 2s ease-in-out infinite;
    }
    .rotate-notice .phone::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      width: 10px;
      height: 3px;
      background: #fff;
      border-radius: 2px;
      transform: translateX(-50%);
    }

    @keyframes rotate {
      0%, 20%   { transform: rotate(0deg); }
      50%, 80%  { transform: rotate(-90deg); }
      100%      { transform: rotate(0deg); }
    }

    .rotate-notice p {
      font-size: 17px;
      line-height: 1.5;
      font-weight: 600;
    }
    .rotate-notice small {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 400;
      opacity: 0.6;
    }

    .rotate-notice button {
      margin-top: 8px;
      background: none;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* 터치 기기 + 세로일 때만 안내 표시 */
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      .rotate-notice { display: flex; }
      body.dismissed .rotate-notice { display: none; }

      /* '세로로 그냥 보기' — 유튜브처럼 영상이 가로폭을 꽉 채움 */
      body.dismissed .stage {
        width: 100%;
        aspect-ratio: auto;
      }
      body.dismissed .title { margin-bottom: 22px; gap: 6px; }
      body.dismissed .logo { width: 46vw; }
      body.dismissed .subtitle { font-size: 12px; }
      body.dismissed .video-wrap {
        width: 100vw;
        box-shadow: none;
      }
      body.dismissed .play-btn { width: 60px; height: 60px; }
      body.dismissed .credit {
        align-self: center;
        text-align: center;
        white-space: normal;
        line-height: 1.8;
        padding: 0 20px 24px;
        font-size: 10px;
      }
      body.dismissed .credit .sep.first { display: block; height: 0; overflow: hidden; }
    }
  </style>
</head>
<body>

  <main class="page">
    <div class="stage-area">
    <div class="stage">
      <header class="title">
        <img class="logo" src="This%20is%20Gallery.svg" alt="This is Gallery" />
        <p class="subtitle">Storyboard-based Demo Video</p>
      </header>
      <div class="video-wrap">
        <video playsinline preload="metadata">
          <source src="demo.mp4#t=0.1" type="video/mp4" />
          영상을 재생할 수 없는 브라우저입니다.
        </video>
        <button class="play-btn" type="button" aria-label="영상 재생">
          <svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>
        </button>
      </div>
    </div>
    </div>
    <footer class="credit">
      <b>명지대학교 디지털콘텐츠디자인학과</b><span class="sep first">|</span><b>60161576</b><span class="sep">|</span><b>이세림</b><span class="sep">|</span><b><a href="mailto:serim@mju.ac.kr">serim@mju.ac.kr</a></b>
    </footer>
  </main>


  <div class="rotate-notice" role="dialog" aria-label="화면 회전 안내">
    <div class="phone"></div>
    <p>화면을 가로로 돌려주세요
      <small>가로 화면에서 더 잘 보여요</small>
    </p>
    <button type="button" onclick="document.body.classList.add('dismissed')">세로로 그냥 보기</button>
  </div>

  <script>
    const video = document.querySelector('.video-wrap video');
    const playBtn = document.querySelector('.play-btn');
    const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
    const isLandscape = () => matchMedia('(orientation: landscape)').matches;
    const isFull = () => document.fullscreenElement || document.webkitFullscreenElement || video.webkitDisplayingFullscreen;

    // 모바일 가로 화면이면 전체화면으로
    function goFullscreen() {
      if (!isTouch || !isLandscape() || isFull()) return;
      try {
        if (video.requestFullscreen) {
          video.requestFullscreen().then(() => {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
          }).catch(() => {});
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();   // 아이폰
        }
      } catch (e) {}
    }

    // 가운데 재생 버튼
    playBtn.addEventListener('click', () => {
      playBtn.hidden = true;
      video.controls = true;
      video.play();
      goFullscreen();
    });

    // 재생 컨트롤로 다시 재생할 때도 가로면 전체화면
    video.addEventListener('play', () => {
      playBtn.hidden = true;
      video.controls = true;
      goFullscreen();
    });
  </script>
</body>
</html>
